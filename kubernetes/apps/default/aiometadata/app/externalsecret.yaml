---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiometadata
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: aiometadata-secret
    template:
      engineVersion: v2
      data:
        # aiometadata has no SECRET_KEY; ADMIN_KEY is its equivalent and also
        # backs IMAGE_PROXY_SIGNING_SECRET. Same values as aiostreams.
        ADMIN_KEY: "{{ .SECRET_KEY }}"
        ADDON_PASSWORD: "{{ .ADDON_PASSWORD_1 }}"
  dataFrom:
    - extract:
        key: aiostreams
    - extract:
        key: cloudnative-pg
