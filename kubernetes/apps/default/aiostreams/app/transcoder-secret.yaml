---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Shared key between aiostreams and its guest streaming transcoder. Nobody
# needs to know it, so it is generated in-cluster instead of stored in
# 1Password, and kept for good (CreatedOnce) so both pods agree on it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: aiostreams-transcoder
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiostreams-transcoder
spec:
  refreshPolicy: CreatedOnce
  target:
    name: aiostreams-transcoder-secret
    template:
      engineVersion: v2
      data:
        PARTY_TRANSCODER_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: aiostreams-transcoder
