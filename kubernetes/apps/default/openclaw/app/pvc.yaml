---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: topolvm-thin-provisioner
---
# Persists the whole container home, mirroring upstream's OPENCLAW_HOME_VOLUME.
# /home/node is an image layer and the container runs readOnlyRootFilesystem, so
# without this the Claude Code installer cannot write: it hardcodes
# $HOME/.claude/downloads, then `claude install` drops the launcher in
# $HOME/.local/bin. openclaw-data stays mounted at /home/node/.openclaw on top
# of this, so existing gateway state is untouched.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: topolvm-thin-provisioner
