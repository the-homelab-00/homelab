---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: openclaw
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      openclaw:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          # Seeds openclaw.json / AGENTS.md into the state volume on first run only.
          # The gateway rewrites its own config at runtime (Control UI, `config set`),
          # so re-copying on every restart would clobber whatever was set in the UI.
          seed-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /home/node/.openclaw/workspace
                [ -f /home/node/.openclaw/openclaw.json ] \
                  || cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
                [ -f /home/node/.openclaw/workspace/AGENTS.md ] \
                  || cp /seed/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          # Installs the Claude Code CLI so the bundled anthropic plugin can use
          # the claude-cli backend instead of an API key. Must run on the
          # openclaw image, not busybox: the installer fetches a native glibc
          # binary and busybox is musl. Skipped once the binary is on the volume.
          install-claude:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.7.1@sha256:6a31d44b2944e7adcd2b582bf6fb463111264ebca97a0201795b799135bd102c
            command:
              - sh
              - -c
              - |
                set -eu
                if [ -x /home/node/.local/bin/claude ]; then
                  echo "claude already installed"
                  exit 0
                fi
                curl -fsSL https://claude.ai/install.sh | bash
                test -x /home/node/.local/bin/claude
            env:
              HOME: /home/node
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.7.1@sha256:6a31d44b2944e7adcd2b582bf6fb463111264ebca97a0201795b799135bd102c
            command: ["node", "/app/dist/index.js", "gateway", "run"]
            env:
              HOME: /home/node
              NODE_ENV: production
              TZ: America/New_York
              OPENCLAW_HOME: /home/node
              OPENCLAW_STATE_DIR: /home/node/.openclaw
              OPENCLAW_CONFIG_DIR: /home/node/.openclaw
              OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
              OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
              OPENCLAW_DISABLE_BONJOUR: "1"
              # The image does not put ~/.local/bin on PATH, and the gateway is
              # exec'd directly rather than through a shell, so .bashrc never
              # applies. Without this the anthropic plugin cannot find claude.
              PATH: /home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom:
              - secretRef:
                  name: openclaw-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 18789
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 250m
                # Was 512Mi against a ~724Mi working set.
                memory: 768Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: openclaw
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["openclaw.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    configMaps:
      config:
        data:
          openclaw.json: |
            {
              "gateway": {
                "mode": "local",
                "bind": "lan",
                "port": 18789,
                "auth": { "mode": "token" },
                "controlUi": {
                  "enabled": true,
                  "allowedOrigins": ["https://openclaw.${SECRET_DOMAIN}"]
                }
              },
              "agents": {
                "defaults": { "workspace": "~/.openclaw/workspace" },
                "list": [
                  {
                    "id": "default",
                    "name": "OpenClaw Assistant",
                    "workspace": "~/.openclaw/workspace"
                  }
                ]
              },
              "cron": { "enabled": false }
            }
          AGENTS.md: |
            # OpenClaw Assistant

            You are a helpful AI assistant running in a single-node Talos homelab
            cluster. Edit this file in the workspace to change your own instructions.
    persistence:
      data:
        existingClaim: openclaw-data
        advancedMounts:
          openclaw:
            seed-config:
              - path: /home/node/.openclaw
            app:
              - path: /home/node/.openclaw
      home:
        existingClaim: openclaw-home
        advancedMounts:
          openclaw:
            install-claude:
              - path: /home/node
            app:
              - path: /home/node
      seed:
        type: configMap
        identifier: config
        advancedMounts:
          openclaw:
            seed-config:
              - path: /seed
      tmp:
        type: emptyDir
        advancedMounts:
          openclaw:
            install-claude:
              - path: /tmp
            app:
              - path: /tmp
