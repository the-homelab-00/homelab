---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: click-log
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: click-log-secret
    template:
      engineVersion: v2
      data:
        # INGEST_TOKEN is also the game's `click_log_token` Creator Hub secret.
        INGEST_TOKEN: "{{ .INGEST_TOKEN }}"
        READ_TOKEN: "{{ .READ_TOKEN }}"
  dataFrom:
    - extract:
        key: click-log
