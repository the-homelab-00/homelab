---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: click-log
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: click-log
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      click-log:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thepotato97/roblox-click-log
              tag: &tag sha-f820c97@sha256:aa258cf73421a3e7a52554f08eacbb4172ffe89bc65031a0fb66bd1ad88a6e44
            env:
              HOST: 0.0.0.0
              PORT: &port 8787
              TZ: Europe/London
              IMAGE: *tag
            envFrom:
              - secretRef:
                  name: click-log-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: &noesc false
              readOnlyRootFilesystem: true
              capabilities: &nocaps { drop: ["ALL"] }
          # the events store; listens on 127.0.0.1 only (resources/clickhouse.xml)
          clickhouse:
            image:
              repository: clickhouse/clickhouse-server
              tag: 25.12.11.4@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
            # straight to the server: the image's entrypoint writes user config into /etc
            command: ["/usr/bin/clickhouse", "server", "--config-file=/etc/clickhouse-server/config.xml"]
            probes:
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: *noesc
              readOnlyRootFilesystem: true
              capabilities: *nocaps
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: click-log
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["clicks.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      # the old SQLite log, read once by `bun src/migrate.mjs /data/clicks.db`
      data:
        existingClaim: click-log-data
        advancedMounts:
          click-log:
            app:
              - path: /data
      clickhouse:
        existingClaim: click-log-clickhouse
        advancedMounts:
          click-log:
            clickhouse:
              - path: /var/lib/clickhouse
      clickhouse-config:
        type: configMap
        name: click-log-clickhouse
        advancedMounts:
          click-log:
            clickhouse:
              - path: /etc/clickhouse-server/config.d/docker_related_config.xml
                subPath: clickhouse.xml
                readOnly: true
      clickhouse-logs:
        type: emptyDir
        advancedMounts:
          click-log:
            clickhouse:
              - path: /var/log/clickhouse-server
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
