---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Its own release so a transcoder that never becomes Ready only rolls itself
# back, not aiostreams (see Helm revisions 42-45 of aiostreams).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app aiostreams-transcoder
  namespace: default
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # Owns aiostreams-transcoder-secret, the key both pods share.
    - name: aiostreams
      namespace: default
    - name: nvidia-device-plugin
      namespace: kube-system
  path: ./kubernetes/apps/default/aiostreams-transcoder/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  timeout: 5m
