---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
spec:
  interval: 30m
  chart:
    spec:
      chart: emqx-operator
      # Do not upgrade past 2.2.x while the broker is EMQX 5.8.x. Operator 2.3.x
      # supports only EMQX 5.9/5.10/6.x and calls the enterprise-only
      # /api/v5/load_rebalance/global_status on every reconcile; against an OSS
      # 5.8 node that 404s and aborts the status reconcile, so the
      # apps.emqx.io/on-serving readiness gate is never set. The core pod then
      # stays NotReady, emqx-listeners loses all endpoints, and every MQTT
      # client (zigbee2mqtt) fails with ECONNREFUSED.
      # See emqx/emqx-operator#1202 (closed as expected behaviour).
      version: 2.2.29
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: database
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  values:
    fullnameOverride: emqx-operator
    image:
      repository: ghcr.io/emqx/emqx-operator
