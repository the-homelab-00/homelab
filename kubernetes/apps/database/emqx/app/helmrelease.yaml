---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
spec:
  interval: 30m
  chart:
    spec:
      chart: emqx-operator
      # Do not raise past 2.2.x while the broker is EMQX 5.8.x. 2.3.x supports
      # only EMQX 5.9/5.10/6.x and calls the enterprise-only
      # /api/v5/load_rebalance/global_status every reconcile; against an OSS
      # 5.8 node that 404s and aborts the status reconcile, so the
      # apps.emqx.io/on-serving readiness gate is never set. The core pod then
      # stays Ready=False, emqx-listeners loses every endpoint, and all MQTT
      # clients fail with ECONNREFUSED.
      # See emqx/emqx-operator#1202 (closed as expected behaviour).
      # Requires skipCRDs below to be downgradeable at all.
      version: 2.2.29
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: database
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  values:
    # NEVER set skipCRDs on an existing release. This chart renders its CRDs
    # from templates/, so Helm owns them; turning skipCRDs on removes them from
    # the rendered manifest and Helm prunes them on the next upgrade. Deleting
    # a CRD cascades to every CR of that type, which took out the EMQX object,
    # its StatefulSet and its PVCs.
    fullnameOverride: emqx-operator
    image:
      repository: ghcr.io/emqx/emqx-operator
