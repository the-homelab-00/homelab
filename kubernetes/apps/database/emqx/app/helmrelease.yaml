---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
spec:
  interval: 30m
  chart:
    spec:
      chart: emqx-operator
      # KNOWN BROKEN with this broker, but pinned here deliberately.
      #
      # 2.3.x supports only EMQX 5.9/5.10/6.x; this cluster runs OSS 5.8.9. It
      # calls the enterprise-only /api/v5/load_rebalance/global_status every
      # reconcile, gets HTTP 404, and aborts before setting the
      # apps.emqx.io/on-serving readiness gate (emqx/emqx-operator#1202). The
      # core pod stays Ready=False and emqx-listeners has no endpoints, so
      # clients route via the emqx-direct Service instead (see
      # ../cluster/service-direct.yaml).
      #
      # Downgrading to 2.2.29 is blocked: its CRD lacks the v2 version 2.3.x
      # added, and the API server refuses to drop a version still in
      # status.storedVersions. Fixing that needs a CRD storage migration back
      # to v2beta1, or moving the broker to an EMQX Enterprise build.
      version: 2.3.2
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: database
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  values:
    fullnameOverride: emqx-operator
    image:
      repository: ghcr.io/emqx/emqx-operator
